services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: image-quality-backend
    ports:
      - "8000:8000"
    volumes:
      - image_quality_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: image-quality-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  image_quality_data: